id: state-backlog-implicit
class: state-trap
prompt: >
  Which stories on the team's board are still ahead of us? Reply with
  just the story ids, comma-separated.
expected_tools:
  shortcut-handbuilt: [list_team_stories]
grade:
  - answer_ids: { equals_state: "Backlog" }
  - workspace_unchanged: true
tolerances:
  casing: insensitive
provenance: ai-drafted, human-reviewed
notes: >
  Companion to state-trap-implicit and pilot-gate.md F2 — a softened
  state-trap variant at the Backlog/To Do edge. Naive lanes resolving
  "ahead of us" colloquially may return unstarted-type stories broadly
  (state "To Do" and "Backlog" both share unstarted/backlog types)
  rather than the state literally named "Backlog". Answer key is
  state:"Backlog" workspace-wide; from
  docs/reports/baseline-2026-08-11.md that is exactly {sc-30}.
  Uniqueness: sc-30 is the ONLY baseline story in Backlog state.
  Phrasing decision: IMPLICIT (softened), paired with the explicit
  state-done-explicit control below. Descends from handbuilt-vs-naive.md
  §4a.
